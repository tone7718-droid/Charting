name: Build Windows EXE

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write  # Release 게시(직접 다운로드 링크)에 필요

# 같은 브랜치에서 동시 실행 시 Release 자산이 서로 덮어쓰지 않도록 직렬화
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # EXE에 포함되는 실제 패키지가 import 단계에서 깨지지 않는지 확인
      - name: Import smoke test
        run: python -c "import therapy_chart.main, therapy_chart.main_window, therapy_chart.settings_dialog; print('import OK')"

      - name: Install PyInstaller
        run: pip install -r requirements-build.txt

      - name: Build EXE
        run: pyinstaller TherapyChart.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TherapyChart-exe
          path: dist/TherapyChart.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # 프로그램 버전(constants.APP_VERSION)을 읽어 설치 프로그램 버전과 일치시킨다
      - name: Read app version
        id: appver
        shell: pwsh
        run: |
          $v = python -c "from therapy_chart.constants import APP_VERSION; print(APP_VERSION)"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.appver.outputs.version }} installer\TherapyChart.iss'

      - name: Verify release tag matches this source
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $tag = "v${{ steps.appver.outputs.version }}"
          $refs = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw "Cannot check release tag" }
          if ($refs.Count -gt 0) {
            $tagCommit = ($refs[-1] -split '\s+')[0]
            if ($tagCommit -ne "${{ github.sha }}") {
              throw "Release $tag already belongs to another commit. Bump APP_VERSION before publishing."
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TherapyChart-installer
          path: installer/Output/TherapyChartSetup.exe

      # main의 빌드만 버전 태그로 배포하며, 게시 실패도 실행 실패로 표시한다.
      - name: Publish versioned release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "TherapyChart v${{ steps.appver.outputs.version }}"
          body: |
            main에서 빌드한 TherapyChart v${{ steps.appver.outputs.version }}입니다.
            소스 커밋: ${{ github.sha }}

            - **TherapyChartSetup.exe** — 설치 프로그램 (권장: 바탕화면 바로가기 생성)
            - **TherapyChart.exe** — 설치 없이 바로 실행하는 단일 파일
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/TherapyChart.exe
            installer/Output/TherapyChartSetup.exe
