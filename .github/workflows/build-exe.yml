name: Build Windows EXE

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write  # Release 게시(직접 다운로드 링크)에 필요

# 같은 브랜치에서 동시 실행 시 Release 자산이 서로 덮어쓰지 않도록 직렬화
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 이 브랜치에 대한 push만 사용자용 latest 릴리스로 배포한다.
# (다른 실험 브랜치를 push해도 사용자 다운로드본이 바뀌지 않도록)
env:
  DEPLOY_BRANCH: refs/heads/main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # EXE에 포함되는 실제 패키지가 import 단계에서 깨지지 않는지 확인
      - name: Import smoke test
        run: python -c "import therapy_chart.main, therapy_chart.main_window, therapy_chart.settings_dialog; print('import OK')"

      - name: Install PyInstaller
        run: pip install "pyinstaller==6.21.0"

      - name: Build EXE
        run: pyinstaller TherapyChart.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TherapyChart-exe
          path: dist/TherapyChart.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # 프로그램 버전(constants.APP_VERSION)을 읽어 설치 프로그램 버전과 일치시킨다
      - name: Read app version
        id: appver
        shell: pwsh
        run: |
          $v = python -c "from therapy_chart.constants import APP_VERSION; print(APP_VERSION)"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.appver.outputs.version }} installer\TherapyChart.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TherapyChart-installer
          path: installer/Output/TherapyChartSetup.exe

      # 배포 브랜치에 대한 push일 때만 로그인 없이 받는 latest 릴리스를 갱신한다.
      # Release 게시 실패가 테스트/빌드/아티팩트 업로드 성공까지 실패로 만들지 않도록 non-blocking 처리한다.
      - name: Publish latest release
        if: github.ref == env.DEPLOY_BRANCH
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "최신 빌드 (자동 게시)"
          body: |
            푸시할 때마다 자동으로 갱신되는 최신 빌드입니다.

            - **TherapyChartSetup.exe** — 설치 프로그램 (권장: 바탕화면 바로가기 생성)
            - **TherapyChart.exe** — 설치 없이 바로 실행하는 단일 파일
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/TherapyChart.exe
            installer/Output/TherapyChartSetup.exe
