name: Build Windows EXE

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write  # Release 게시(직접 다운로드 링크)에 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller TherapyChart.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TherapyChart-exe
          path: dist/TherapyChart.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\TherapyChart.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TherapyChart-installer
          path: installer/Output/TherapyChartSetup.exe

      # 로그인 없이 바로 다운로드할 수 있도록 최신 빌드를 Release로 게시
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "최신 빌드 (자동 게시)"
          body: |
            푸시할 때마다 자동으로 갱신되는 최신 빌드입니다.

            - **TherapyChartSetup.exe** — 설치 프로그램 (권장: 바탕화면 바로가기 생성)
            - **TherapyChart.exe** — 설치 없이 바로 실행하는 단일 파일
          make_latest: true
          files: |
            dist/TherapyChart.exe
            installer/Output/TherapyChartSetup.exe
