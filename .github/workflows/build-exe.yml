name: Build Windows EXE

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller TherapyChart.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TherapyChart-exe
          path: dist/TherapyChart.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\TherapyChart.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TherapyChart-installer
          path: installer/Output/TherapyChartSetup.exe
