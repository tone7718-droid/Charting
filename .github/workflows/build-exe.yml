name: Build Windows EXE

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name TherapyChart therapy_chart.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TherapyChart-exe
          path: dist/TherapyChart.exe
